<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Bytarc Labs</title>
<script>
  // Old Burnay Labs addresses: keep the path, rename the education project, then go to the matching Bytarc domain.
  (function () {
    var path = location.pathname.replace(/^\/burnaylabs-site(\/|$)/, "/bytarclabs-site$1");
    location.replace("https://bytarc.com" + path + location.search + location.hash);
  })();
</script>
<meta http-equiv="refresh" content="0; url=https://bytarc.com/">
<link rel="canonical" href="https://bytarc.com/">
</head>
<body>
<p>Este site mudou para <a href="https://bytarc.com/">bytarc.com</a>.</p>
</body>
</html>
